name: Deploy salesmore-llm to GCP

on:
  push:
    branches: [main]
    paths-ignore:
      # Zmiany tylko w dokumentacji nie wymagają deployu.
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# Serializuj deploye — nigdy dwa naraz. Bez tego dwa szybkie merge'e do main
# mogłyby się wyścigać i starszy deploy skończyłby jako ostatni, nadpisując
# nowszy. cancel-in-progress:false → biegnący deploy nie jest przerywany
# (brak stanów pół-wdrożonych backend/frontend), kolejny czeka w kolejce.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-central2
  BACKEND_SERVICE: salesmore-llm-backend
  FRONTEND_SERVICE: salesmore-llm-frontend
  BACKEND_IMAGE: europe-central2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/salesmore-llm/backend
  FRONTEND_IMAGE: europe-central2-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/salesmore-llm/frontend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

  deploy-backend:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev

      - name: Build and push backend image
        run: |
          docker build -t $BACKEND_IMAGE:${{ github.sha }} -t $BACKEND_IMAGE:latest ./backend
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $BACKEND_IMAGE:latest

      - name: Deploy backend to Cloud Run
        run: |
          gcloud run deploy $BACKEND_SERVICE \
            --image $BACKEND_IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --add-cloudsql-instances ${{ secrets.CLOUDSQL_INSTANCE }} \
            --set-secrets "ANTHROPIC_API_KEY=anthropic-api-key:latest,JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest" \
            --set-env-vars "NODE_ENV=production,USE_LOCAL_SECRETS=false,GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},CHAT_MODEL=claude-sonnet-5,JUDGE_MODEL=claude-haiku-4-5-20251001,PRECHECK_ENABLED=true,PRECHECK_MODEL=claude-haiku-4-5-20251001"

  deploy-frontend:
    needs: [test, deploy-backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-central2-docker.pkg.dev

      - name: Get backend URL
        id: backend_url
        run: |
          URL="$(gcloud run services describe $BACKEND_SERVICE --region $REGION --format 'value(status.url)')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image
        run: |
          docker build -t $FRONTEND_IMAGE:${{ github.sha }} -t $FRONTEND_IMAGE:latest ./frontend
          docker push $FRONTEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:latest

      - name: Deploy frontend to Cloud Run
        run: |
          gcloud run deploy $FRONTEND_SERVICE \
            --image $FRONTEND_IMAGE:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars "NODE_ENV=production,BACKEND_URL=${{ steps.backend_url.outputs.url }}"
